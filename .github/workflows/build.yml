name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Every build gets its own version (0.2.<build number>) so installed apps see it as an update.
      - name: Set version from build number
        shell: bash
        run: |
          V="0.2.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='$V';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Building Pianoverse $V"

      # Fail fast with a readable message instead of a long Rust build that dies at the signing step.
      - name: Check update-signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Pianoverse v__VERSION__'
          releaseBody: |
            Already have Pianoverse 0.2 or newer? It updates itself: click **Install and restart** in the top bar.
            First install: download **Pianoverse_*_x64-setup.exe** below and run it.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # If the build failed, rebuild (fast, cached) and surface the error lines as annotations,
      # so the cause is visible on the run page without opening the raw log.
      - name: Show build errors
        if: failure()
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build > build.log 2>&1 || true
          sed -i 's/\x1b\[[0-9;]*m//g' build.log
          grep -nE "error|Error|failed|panicked|warning: unused" build.log | grep -v "^.*Compiling" | head -40 > errs.txt || true
          tail -25 build.log > tail.txt
          enc() { sed -e 's/%/%25/g' "$1" | head -c 3500 | awk 'BEGIN{ORS="%0A"}{print}'; }
          echo "::error title=Build errors::$(enc errs.txt)"
          echo "::error title=Build log tail::$(enc tail.txt)"
