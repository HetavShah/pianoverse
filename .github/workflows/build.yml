name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Every build gets its own version (0.2.<build number>) so installed apps see it as an update.
      - name: Set version from build number
        shell: bash
        run: |
          V="0.2.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='$V';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Building Pianoverse $V"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 'Pianoverse v__VERSION__'
          releaseBody: |
            Already have Pianoverse 0.2 or newer? It updates itself: click **Install and restart** in the top bar.
            First install: download **Pianoverse_*_x64-setup.exe** below and run it.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
